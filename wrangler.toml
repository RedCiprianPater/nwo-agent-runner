name = "nwo-agent-runner"
main = "src/index.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# ── Cron trigger: fires every 15 minutes ──
[triggers]
crons = ["*/15 * * * *"]

# ── Workers AI binding for Kimi K2.6 ──
[ai]
binding = "AI"

# ── Durable Object: single-instance agent coordinator ──
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "AgentCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentCoordinator"]

# ── KV: genesis cache, planning graph, config ──
# Create with: wrangler kv:namespace create AGENT_KV
[[kv_namespaces]]
binding = "AGENT_KV"
id = "192b83585c7e401da85a83c3a6888a9f"

# ── Queue: sub-agent task processing ──
# Create with: wrangler queues create nwo-subagent-tasks
[[queues.producers]]
binding = "SUBAGENT_QUEUE"
queue = "nwo-subagent-tasks"

[[queues.consumers]]
queue = "nwo-subagent-tasks"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "nwo-subagent-dlq"

# ── Plain vars (non-secret config) ──
[vars]
AGENT_WALLET_ADDRESS   = "0xA745019B103A3e7A75eA966e96937203582bc2a7"
GUARDIAN_ADDRESS        = "0x9602A673d165870b7737A93971258a6B4DdA992C"
CONWAY_CONTRACT         = "0xC699b07f997962e44d3b73eB8E95d5E0082456ac"
BASE_RPC                = "https://mainnet.base.org"
L5_GATEWAY_URL          = "https://nwo-robotics-api.onrender.com"
TIMESFM_URL             = "https://nwo-timesfm.onrender.com"
AGENT_GRAPH_URL         = "https://cpater-nwo-agent-graph.hf.space"
CARDIAC_RELAYER         = "https://nwo-relayer.onrender.com"

# ── Secrets ──
# Set via CLI (never commit these):
#   wrangler secret put AGENT_PRIVATE_KEY
#   wrangler secret put KIMI_API_KEY             (optional fallback)
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put HF_TOKEN                  (optional)
#   wrangler secret put IDENTITY_SERVICE_KEY
#   wrangler secret put AGENT_GRAPH_POST_TOKEN    (optional)

# ── Observability ──
[observability]
enabled = true
